name: Monitoreo YouTube

on:
  schedule:
    # Lunes a viernes de 7:00 a 15:00 hs Argentina (10:00 a 18:00 UTC) cada 30 min
    - cron: '0,30 10-18 * * 1-5'
  # Permite ejecutarlo manualmente en cualquier momento desde GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASSWORD: ${{ secrets.WEBSHARE_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python app.py

      - name: Guardar estado si se proceso un nuevo video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ultimo_video.txt videos_procesados.txt
          git diff --staged --quiet || (git commit -m "Auto: actualizar estado de videos [skip ci]" && git push)
